# Netlify settings for the TypeWit web app (set "Base directory" to `web` in Netlify).
# Settings in this file take precedence over the ones typed into the Netlify UI.
# The site is a static export (see next.config.ts), so Netlify only serves files from `out`.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  # These two values are public by design: they are compiled into the browser bundle,
  # and Row Level Security in Supabase protects the data. Don't let the secret scanner fail the build on them.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Only Microsoft Office may frame the site (Word on the web shows the add-in pane in a frame);
    # this replaces X-Frame-Options, which can't allow Office. Scripts aren't restricted here
    # because Office.js and Google Picker load further code from hosts they choose.
    Content-Security-Policy = "frame-ancestors 'self' https://*.officeapps.live.com https://*.office.com https://*.office365.com https://*.sharepoint.com https://*.microsoft365.com https://*.cloud.microsoft; base-uri 'self'; object-src 'none'; form-action 'self'; upgrade-insecure-requests"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
