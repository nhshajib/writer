name: Security audit probes
on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/security-audit-*'
permissions:
  contents: read
jobs:
  boundaries:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read-only production boundaries and repository secret scan
        run: node scripts/security-probe.mjs
  dependency-patch:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare exact patch without force
        run: npm install --package-lock-only --ignore-scripts --save-exact next@15.5.29
      - name: Record generated manifests for review
        run: |
          node -e 'const fs = require("fs"); for (const f of ["package.json", "package-lock.json"]) console.log("AUDIT_MANIFEST_" + f + "_BEGIN\n" + fs.readFileSync(f, "utf8") + "\nAUDIT_MANIFEST_END");'
      - name: Audit generated dependency patch
        run: npm ci && npm run audit
  trial-reservation-database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: fixture-local-only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Initialize isolated fixture
        run: psql -v ON_ERROR_STOP=1 -f scripts/security-trial-fixture.sql
      - name: Apply new migration twice
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261123000001_trial_checkout_reservations.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261123000001_trial_checkout_reservations.sql
      - name: Eligibility and grants
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/trial_reservation_database_test.sql
      - name: Concurrent aliased accounts
        run: python3 scripts/security-trial-race.py
  deno-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task check
      - run: deno task test
      - name: Record generated lockfile for review
        run: |
          node -e 'const fs = require("fs"); console.log("AUDIT_DENO_LOCK_BEGIN\n" + fs.readFileSync("deno.lock", "utf8") + "\nAUDIT_DENO_LOCK_END");'
